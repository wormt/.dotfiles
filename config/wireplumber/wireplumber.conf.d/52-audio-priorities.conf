wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    hooks.device.profile.state = disabled
    hooks.default-nodes.state = disabled
    loopback.headphones-mono = required
  }
}

wireplumber.components = [
  { name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "headphones-mono"
      node.description = "Headphones (mono, right only)"
      capture.props = {
        media.class = Audio/Sink
        audio.position = [ MONO ]
        priority.session = 0
        filter.smart = true
        filter.smart.name = "headphones-mono"
        filter.smart.target = { node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Headphones__sink" }
      }
      playback.props = {
        audio.channels = 1
        audio.position = [ FR ]
        stream.dont-remix = true
        node.passive = true
        media.role = "Loopback"
      }
    }
    provides = loopback.headphones-mono
  }
]

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:analog-stereo+input:analog-stereo"
          "output:analog-stereo+input:mono-fallback"
          "output:analog-stereo"
        ]
      }
    }
  }
]

wireplumber.settings = {
  node.stream.restore-target = false
}

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        node.disabled = false
        priority.session = 3000
        priority.driver = 3000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Logitech_Logi_USB_Headset_.*" }
    ]
    actions = {
      update-props = {
        node.disabled = false
        priority.session = 1000
        priority.driver = 1000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Kingston_HyperX_Quadcast.*" }
    ]
    actions = {
      update-props = {
        node.disabled = false
        priority.session = 4500
        priority.driver = 4500
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-.*MeetUp.*" }
    ]
    actions = {
      update-props = {
        node.disabled = false
        priority.session = 4000
        priority.driver = 4000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__HDMI.*" }
    ]
    actions = {
      update-props = {
        node.disabled = false
        priority.session = 200
        priority.driver = 200
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Lenovo_.*" }
      { node.name = "~alsa_output.usb-Dell_.*" }
      { node.name = "~alsa_output.usb-Kensington_.*" }
      { node.name = "~alsa_output.usb-DisplayLink_.*" }
      { node.name = "~alsa_output.usb-Generic_USB_Audio_.*" }
      { node.name = "~alsa_output.usb-.*[Dd]ock.*" }
    ]
    actions = {
      update-props = {
        node.disabled = false
        priority.session = 100
        priority.driver = 100
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-DisplayLink_SD4760P_.*analog.*" }
    ]
    actions = {
      update-props = {
        node.disabled = false
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-.*iec958.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Kingston_HyperX_Quadcast.*" }
    ]
    actions = {
      update-props = {
        priority.session = 5000
        priority.driver = 5000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-.*MeetUp.*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
        priority.driver = 3000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Logitech_Logi_USB_Headset_.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Headset__source" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver = 1500
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        priority.session = 500
        priority.driver = 500
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Lenovo_.*" }
      { node.name = "~alsa_input.usb-Dell_.*" }
      { node.name = "~alsa_input.usb-Kensington_.*" }
      { node.name = "~alsa_input.usb-DisplayLink_.*" }
      { node.name = "~alsa_input.usb-Generic_USB_Audio_.*" }
      { node.name = "~alsa_input.usb-.*[Dd]ock.*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
        priority.driver = 100
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*iec958.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
