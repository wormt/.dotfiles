set-option -g default-terminal screen-256color
set-option -g mode-keys vi
set-option -g status-keys vi
set-option -g pane-active-border-style fg=yellow
set-option -g pane-border-style fg=black
set -g default-shell /home/linuxbrew/.linuxbrew/bin/nu
set -g status on
set -g mouse on
set -g allow-passthrough off # osc stuff

# binds
bind-key -n C-t new-window      # ctrl t
bind-key -n C-l next-window     # ctrl l
bind-key -n C-h previous-window # ctrl h

# statusbar
set -g status-position top
set -g status-style "bg=colour53,fg=white"
set -g status-left "#[fg=yellow]#S "
set -g status-right-length 100
set -g status-right "#[fg=cyan]#(cut -d' ' -f1-3 /proc/loadavg)  #[fg=magenta]#(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf \"%%d/%%dG\", (t-a)/1048576, t/1048576}' /proc/meminfo)#[fg=orange]#(cd \"#{pane_current_path}\" 2>/dev/null; git branch --show-current 2>/dev/null | sed 's/^/  /')  #[fg=brightblue]#h"
setw -g monitor-bell off
setw -g monitor-activity off
setw -g monitor-silence 30
set -g window-status-style "fg=brightblack"
set -g window-status-format "#I:#{pane_current_command}#F "
set -g window-status-current-style "fg=white,bold"
set -g window-status-current-format "#I:#{pane_current_command}#F "
set -g window-status-activity-style "fg=red"
set -g window-status-bell-style "fg=red,reverse"
