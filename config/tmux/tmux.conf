set-option -g default-terminal tmux-256color
# truecolor
set -as terminal-features ',xterm-ghostty:RGB,*256col*:RGB'
# vim: no Esc lag
set -sg escape-time 10
set -g focus-events on
set-option -g mode-keys vi
set-option -g status-keys vi
set-option -g pane-active-border-style fg=yellow
set-option -g pane-border-style fg=black
if-shell 'test -x /usr/bin/nu' 'set -g default-shell /usr/bin/nu' 'set -g default-shell /opt/homebrew/bin/nu'
set -g status on
set -g mouse on
set -g allow-passthrough on # osc stuff

# binds
bind-key -n C-t new-window      # ctrl t
bind-key -n M-l next-window     # alt l
bind-key -n M-h previous-window # alt h
# vim pane nav (also see Nav() in vimrc)
bind-key -n C-h if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{m/r:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}" 'send-keys C-l' 'select-pane -R'
bind -n C-o command-prompt -kp key 'send %%%'

# statusbar
set -g status-position top
set -g status-style "bg=colour53,fg=white"
set -g status-left "#[fg=yellow]#S "
set -g status-right-length 100
set -g status-right "#[fg=cyan]#(cut -d' ' -f1-3 /proc/loadavg)  #[fg=magenta]#(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf \"%%d/%%dG\", (t-a)/1048576, t/1048576}' /proc/meminfo)#[fg=orange]#(cd \"#{pane_current_path}\" 2>/dev/null; git branch --show-current 2>/dev/null | sed 's/^/  /')  #[fg=brightblue]#h"
# macOS
if-shell 'test ! -r /proc/loadavg' 'set -g status-right "#[fg=cyan]#(sysctl -n vm.loadavg | tr -d \"{}\" | awk \"{print \\$1,\\$2,\\$3}\")#[fg=orange]#(cd \"#{pane_current_path}\" 2>/dev/null; git branch --show-current 2>/dev/null | sed \"s/^/  /\")  #[fg=brightblue]#h"'
setw -g monitor-bell off
setw -g monitor-activity off
setw -g monitor-silence 0
set -g window-status-style "fg=brightblack"
set -g window-status-format "#I:#{pane_current_command}#F "
set -g window-status-current-style "fg=white,bold"
set -g window-status-current-format "#I:#{pane_current_command}#F "
set -g window-status-activity-style "fg=red"
set -g window-status-bell-style "fg=red,reverse"
