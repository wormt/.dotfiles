line-length = 80
preview = true

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TRY",   # tryceratops
    "PIE",   # flake8-pie
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "ERA",   # eradicate
    "BLE",   # flake8-blind-except
    "RUF",   # Ruff-specific rules
    "ASYNC", # flake8-async
    "UP",    # pyupgrade
    "FA",    # flake8-future-annotations
    "FURB",  # refurb
    "PERF",  # perflint
    "I",     # isort
    "N",     # pep8-naming
    "ICN",   # flake8-import-conventions
    "TID",   # flake8-tidy-imports
    "INP",   # flake8-no-pep420
    "TC",    # flake8-type-checking (was TCH)
    "ANN",   # flake8-annotations
    "C4",    # flake8-comprehensions
    "ISC",   # flake8-implicit-str-concat
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "YTT",   # flake8-2020
    "PTH",   # flake8-use-pathlib
    "T20",   # flake8-print
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "S",     # flake8-bandit
    "DOC",   # pydoclint
]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
